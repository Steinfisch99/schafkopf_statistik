[package]
name = "schafkopf-app"
version.workspace = true
edition.workspace = true
description = "Prototyp der Schafkopf-Statistik-App (Dioxus)"

[dependencies]
dioxus = "0.7"
jni = "0.21"
ndk-context = "0.1"
schafkopf-core = { path = "../schafkopf-core" }
schafkopf-charts = { path = "../schafkopf-charts" }

[features]
# `dx` schaltet je nach Plattform das passende Feature ein (siehe docs/android-app.md).
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

# Nur für die Web-Version (iOS und andere über den Browser). Android und Desktop übersetzen diese Pakete nicht mit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }
