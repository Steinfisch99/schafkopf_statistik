[workspace]
resolver = "2"
members = ["crates/schafkopf-core", "crates/schafkopf-charts", "crates/schafkopf-app"]

[workspace.package]
version = "0.6.0"
edition = "2021"

# Release-Builds (`./scripts/build-apk.sh --release`, `cargo build --release`): kleiner und deutlich schneller als Debug,
# dafür dauert das Bauen länger.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Web-Version: wie release, aber ohne `strip`, weil wasm-bindgen die Abschnitte im Modul noch braucht.
[profile.web]
inherits = "release"
strip = false
opt-level = "s"
